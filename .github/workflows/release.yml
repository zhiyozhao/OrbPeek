name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import signing identity
        env:
          P12_BASE64: ${{ secrets.ORBPEEK_DEV_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ORBPEEK_DEV_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=orbpeek-signing.keychain-db
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > /tmp/orbpeek-dev.p12
          security import /tmp/orbpeek-dev.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm /tmp/orbpeek-dev.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Set version from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Info.plist

      - name: Build
        run: ./build.sh

      - name: Verify signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict OrbPeek.app
          codesign -dvv OrbPeek.app 2>&1 | grep "Authority=OrbPeek Dev"

      # Launch the freshly built app on the CI runner and assert it survives
      # opening the settings window (which exercises KeyboardShortcuts'
      # resource bundle). Checking that files EXIST in the .app proves nothing
      # about loadability — this is the step that would have caught the
      # Bundle.module SIGTRAP before v1.0.1 shipped.
      - name: Smoke test (launch + open settings)
        run: |
          set -euo pipefail
          OrbPeek.app/Contents/MacOS/OrbPeek --show-settings &
          PID=$!
          sleep 5
          kill -0 "$PID"
          kill "$PID" || true

      - name: Package DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dmg
          cp -R OrbPeek.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname OrbPeek -srcfolder dmg -ov -format UDZO "OrbPeek-$VERSION.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "OrbPeek-$VERSION.dmg" \
            --title "OrbPeek $VERSION" --generate-notes
