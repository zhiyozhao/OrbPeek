name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_BUNDLE: OrbPeek.app
  DISPLAY_NAME: OrbPeek
  DMG_TEMPLATE: OrbPeek-VERSION.dmg
  INFO_PLIST: Info.plist

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import signing identity
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=signing.keychain-db
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > /tmp/dev-x.p12
          security import /tmp/dev-x.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm /tmp/dev-x.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Set version from tag
        if: env.INFO_PLIST != ''
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$INFO_PLIST"

      - name: Build
        run: Scripts/build-app.sh

      - name: Verify signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "$APP_BUNDLE"
          codesign -dvv "$APP_BUNDLE" 2>&1 | grep "Authority=DEV X"

      - name: Smoke test (launch)
        run: |
          set -euo pipefail
          BINARY="$APP_BUNDLE/Contents/MacOS/$(basename "$APP_BUNDLE" .app)"
          "$BINARY" &
          PID=$!
          sleep 5
          kill -0 "$PID"
          kill "$PID" || true

      - name: Package DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="${DMG_TEMPLATE/VERSION/$VERSION}"
          mkdir dmg
          cp -R "$APP_BUNDLE" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "$DISPLAY_NAME" -srcfolder dmg -ov -format UDZO "$DMG_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="${DMG_TEMPLATE/VERSION/$VERSION}"
          gh release create "$GITHUB_REF_NAME" "$DMG_NAME" \
            --title "$DISPLAY_NAME $VERSION" --generate-notes
